name: Publish NuGet

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: src/Umbraco.Community.ClientTrace/Client/package-lock.json
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Validate complete version, compatibility and release ancestry
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/validate-release.py "$RELEASE_TAG" --check-ancestry
      - name: Build and test browser clients at the tag version
        working-directory: src/Umbraco.Community.ClientTrace/Client
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm ci
          npm version "$VERSION" --allow-same-version --no-git-tag-version --ignore-scripts
          node --input-type=module -e 'import fs from "node:fs"; const file="public/umbraco-package.json"; const manifest=JSON.parse(fs.readFileSync(file,"utf8")); manifest.version=process.env.VERSION; fs.writeFileSync(file,JSON.stringify(manifest,null,2)+"\n");'
          npm test
          npm run build
          npm run test:assets
          npm audit --omit=dev
      - name: Restore, build, test and pack exactly the tag version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          dotnet restore Umbraco.Community.ClientTrace.slnx -p:Version="$VERSION"
          dotnet build Umbraco.Community.ClientTrace.slnx -c Release --no-restore -p:Version="$VERSION"
          dotnet test tests/Umbraco.Community.ClientTrace.Tests/Umbraco.Community.ClientTrace.Tests.csproj -c Release --no-build --no-restore -p:Version="$VERSION"
          dotnet pack src/Umbraco.Community.ClientTrace/Umbraco.Community.ClientTrace.csproj -c Release --no-build --no-restore -p:Version="$VERSION" -o artifacts
          python3 scripts/verify-package.py artifacts/Umbraco.Community.ClientTrace.*.nupkg "$VERSION"
          python3 scripts/test-verifiers.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error
      - name: NuGet login with GitHub OIDC
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push the verified package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
